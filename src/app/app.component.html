<app-header />
<!-- can use self closing tag when there's nothing between the tags -->
<main>
  <div id="dashboard">
    <app-dashboard-item [image]="{src:'status.png', alt:'Signal symbol'}" [title]="'Server status'">
      <!-- or title="title can be given without []" -->
      <app-server-status></app-server-status>
    </app-dashboard-item>

  <app-dashboard-item [image]="{src: 'globe.png', alt:'A globe'}" title="Traffic">
      <app-traffic></app-traffic>
    </app-dashboard-item>

  <app-dashboard-item [image]="{src: 'list.png', alt:'list'}" title="Support tickets">
      <app-tickets></app-tickets>
    </app-dashboard-item>
  </div>
</main>
