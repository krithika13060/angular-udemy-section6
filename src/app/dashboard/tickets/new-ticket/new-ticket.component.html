<!-- <form (ngSubmit)="onSubmit(titleInput.value, textInput.value, form)" #form> -->
    <form (ngSubmit)="onSubmit(titleInput.value, textInput.value)" #form>
    <app-control label="Title">
        <!-- adding the value to a template variable -->
        <input type="text" name="title" id="title" #titleInput #input>
       
    </app-control>
    <app-control label="Request" #ctrl>
        <textarea type="text" name="request" id="request" rows="3" #textInput #input></textarea>
    </app-control>
    <p>
        <!-- since appBtn - it is ButtonComponent; else HTMLButtonElement -->
        <button appButton #btn>Submit
            <span ngProjectAs="icon">+</span></button>
    </p>
</form>
<!-- <p>{{enteredTitle}} is the ip</p> -->
